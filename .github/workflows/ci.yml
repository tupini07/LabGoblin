name: Model-free CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  COPILOT_SKIP_CLI_DOWNLOAD: "1"

jobs:
  regression:
    name: ${{ matrix.os }} Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["windows-latest", "ubuntu-latest"]
        python: ["3.11", "3.13"]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Prepare isolated core and test environment
        run: |
          $venv = Join-Path $env:RUNNER_TEMP "regression-env"
          python -m venv $venv
          $bin = if ($IsWindows) { "Scripts" } else { "bin" }
          $exe = if ($IsWindows) { "python.exe" } else { "python" }
          $python = Join-Path (Join-Path $venv $bin) $exe
          & $python -m pip install -e . pytest
          "TEST_PYTHON=$python" >> $env:GITHUB_ENV
      - name: Native ownership and model-free SDK regressions
        run: '& $env:TEST_PYTHON -m pytest tests -q --basetemp (Join-Path $env:RUNNER_TEMP "regression") --junitxml=regression.xml'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: regression-${{ matrix.os }}-${{ matrix.python }}
          path: regression.xml

  package:
    name: Clean wheel and installed example
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Build wheel and sdist
        run: |
          python -m pip install build
          python -m build --outdir "${{ runner.temp }}\dist"
      - name: Inspect exact distribution contents
        run: python tests\package_check.py "${{ runner.temp }}\dist"
      - name: Install wheel outside source environment
        run: |
          python -m venv "${{ runner.temp }}\installed"
          $wheel = (Get-ChildItem "${{ runner.temp }}\dist\*.whl").FullName
          & "${{ runner.temp }}\installed\Scripts\python.exe" -m pip install $wheel
      - name: Installed model-free acceptance
        working-directory: ${{ runner.temp }}
        run: '& "${{ runner.temp }}\installed\Scripts\python.exe" -I "${{ github.workspace }}\tests\installed_smoke.py" --root "${{ runner.temp }}\example"'

  browser:
    name: Read-only inspector browser
    runs-on: windows-latest
    env:
      LABGOBLIN_BROWSER_TESTS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Prepare isolated browser environment
        run: |
          python -m venv "${{ runner.temp }}\browser-env"
          & "${{ runner.temp }}\browser-env\Scripts\python.exe" -m pip install -e . pytest playwright
          & "${{ runner.temp }}\browser-env\Scripts\python.exe" -m playwright install chromium
      - name: Model-free chat and evidence navigation
        run: '& "${{ runner.temp }}\browser-env\Scripts\python.exe" -m pytest tests\test_inspector_browser.py -q --basetemp "${{ runner.temp }}\inspector-browser" --junitxml=browser.xml'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: inspector-browser
          path: |
            browser.xml
            ${{ runner.temp }}\inspector-browser\**\*.png
